<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Regio · Écran (aperçu)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Source+Serif+4:opsz,wght@8..60,400&amp;family=Montserrat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#000}</style>
</helmet>
<div style="position: relative; width: 100%; aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden; background: #000; font-family: Inter, sans-serif">
  <sc-if value="{{camPc}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #6B5A4A 0%, #54473C 55%, #3B322B 100%)">
      <div style="position: absolute; left: 8%; top: 12%; width: 18%; height: 60%; border-radius: 6px; background: #7A6754"></div>
      <div style="position: absolute; left: 50%; top: 20%; width: 13%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: #9B6B45"></div>
      <div style="position: absolute; left: 50%; bottom: 0; width: 40%; height: 48%; transform: translateX(-50%); border-radius: 46% 46% 0 0; background: #1E2433"></div>
    </div>
  </sc-if>
  <sc-if value="{{camPhone}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #3F4F5E 0%, #33404C 60%, #262F38 100%)">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: #5A3B2A"></div>
      <div style="position: absolute; left: 44%; bottom: 30%; width: 12%; height: 22%; border-radius: 4px; background: #6E5440"></div>
      <div style="position: absolute; left: 46.5%; top: 24%; width: 7%; aspect-ratio: 1; border-radius: 50%; background: #A0714A"></div>
      <div style="position: absolute; left: 44.5%; top: 34%; width: 11%; height: 20%; border-radius: 40% 40% 0 0; background: #EAE3D2"></div>
    </div>
  </sc-if>
  <sc-if value="{{lower}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 5%; right: 5%; bottom: 6%; padding: 2.2cqw 3cqw; border-radius: 1.2cqw; background: rgba(14,21,48,0.88)">
      <div style="font-family: Montserrat, sans-serif; font-weight: 600; font-size: 1.8cqw; letter-spacing: 0.06em; color: #E8B44C">{{refText}}</div>
      <div style="margin-top: 0.6cqw; font-family: 'Source Serif 4', Georgia, serif; font-size: 2.7cqw; line-height: 1.35; color: #F6F2E8">{{bodyText}}</div>
    </div>
  </sc-if>
  <sc-if value="{{full}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 11%; background: radial-gradient(ellipse at 50% 40%, #1E2A52 0%, #0E1530 72%)">
      <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 3.8cqw; line-height: 1.38; color: #F6F2E8; white-space: pre-line">{{bodyText}}</div>
      <div style="margin-top: 2.4cqw; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 1.9cqw; letter-spacing: 0.06em; color: #E8B44C">{{refText}}</div>
    </div>
  </sc-if>
  <sc-if value="{{standby}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2cqw; background: radial-gradient(ellipse at 50% 42%, #1E2A52 0%, #0E1530 70%)">
      <svg viewBox="0 0 100 100" aria-hidden="true" style="width: 10cqw; height: 10cqw"><rect x="9.5" y="19.5" width="81" height="61" rx="15" fill="none" stroke="#F6F2E8" stroke-width="7"></rect><path d="M36.5 63 V43" fill="none" stroke="#F6F2E8" stroke-width="9" stroke-linecap="round"></path><path d="M36.5 51 C36.5 42 43.5 37 52.5 37" fill="none" stroke="#F6F2E8" stroke-width="9" stroke-linecap="round"></path><circle cx="62.5" cy="37" r="6" fill="#E8B44C"></circle></svg>
      <div style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 5cqw; color: #E8B44C">Bienvenue</div>
      <div style="font-size: 2.2cqw; color: #C9CEDD">Le culte va bientôt commencer</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"cam":{"editor":null},"$preview":{"width":640,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item || { kind: 'standby' };
    const cam = this.props.cam || 'pc';
    const k = it.kind;
    const showsCam = k === 'camera' || k === 'lower';
    return {
      camPc: showsCam && cam === 'pc',
      camPhone: showsCam && cam === 'phone',
      lower: k === 'lower',
      full: k === 'full',
      standby: k === 'standby',
      refText: it.ref || '',
      bodyText: it.text || '',
    };
  }
}
</script>
</body>
</html>
