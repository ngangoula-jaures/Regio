<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Regio — film</title>
<!-- Polices embarquées (hors ligne), celles de la charte Regio. -->
<link rel="stylesheet" href="/node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="/node_modules/@fontsource-variable/sora/index.css">
<link rel="stylesheet" href="/node_modules/@fontsource-variable/source-serif-4/index.css">
<link rel="stylesheet" href="/node_modules/@fontsource-variable/montserrat/index.css">
<style>
:root{--nuit:#0e1530;--nuit2:#18213f;--nuit3:#253055;--prof:#111933;--or:#e8b44c;--ivoire:#f6f2e8;--ardoise:#9aa3bf;--doux:#c9cedd;--bord:#3a4568;--pret:#4cc38a;--direct:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--nuit);color:var(--ivoire);font-family:"Inter Variable",Inter,sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#1c2a5e 0%,#0e1530 62%,#0a1026 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity}
.abs{position:absolute}
.title{position:absolute;left:0;right:0;text-align:center;font-family:"Sora Variable",Sora,sans-serif;font-weight:700;letter-spacing:-.025em;line-height:1.08;padding:0 6%}
.title .l{display:block}
.sub{position:absolute;left:0;right:0;text-align:center;color:var(--doux);font-weight:500;padding:0 8%}
.gold{color:var(--or)}
.screen{position:absolute;overflow:hidden;border-radius:22px;background:var(--nuit);box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 2px rgba(246,242,232,.08)}
.cap{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.cap img{position:absolute;inset:0;width:100%;height:100%}
.ring{position:absolute;border:3px solid var(--or);border-radius:14px;box-shadow:0 0 30px rgba(232,180,76,.55)}
.cursor{position:absolute;width:34px;height:34px;transform-origin:0 0}
.ripple{position:absolute;border-radius:50%;border:3px solid var(--or)}
.chip{display:inline-flex;align-items:center;gap:.5em;padding:.42em .95em;border-radius:999px;background:var(--nuit3);color:var(--ivoire);font-weight:600;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.chip i{width:.5em;height:.5em;border-radius:50%;background:var(--bord);display:inline-block}
.chips{position:absolute;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:22px}
.tv{position:absolute;border-radius:18px;background:#05070f;padding:14px;box-shadow:0 40px 80px rgba(0,0,0,.6)}
.tv .in{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#000}
.tv .in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tv .foot{position:absolute;left:50%;bottom:-46px;width:22%;height:46px;transform:translateX(-50%);background:linear-gradient(#0a0d18,#05070f);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}
.label{position:absolute;font-weight:700;color:var(--doux);text-align:center;letter-spacing:.01em}
.phone{position:absolute;border-radius:44px;background:#05070f;padding:16px;box-shadow:0 40px 80px rgba(0,0,0,.6)}
.phone .in{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden}
.phone .in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pill{position:absolute;display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(14,21,48,.88);font-weight:700;white-space:nowrap}
.pill i{width:12px;height:12px;border-radius:50%;background:var(--direct)}
.live{background:var(--direct);color:var(--nuit)}
.live i{background:var(--nuit)}
.key{position:absolute;display:grid;place-items:center;border-radius:18px;background:var(--ivoire);color:var(--nuit);font-family:"Sora Variable",sans-serif;font-weight:700;box-shadow:0 8px 0 #b9b3a6,0 20px 40px rgba(0,0,0,.45)}
.camcard{position:absolute;border-radius:16px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5);border:3px solid rgba(246,242,232,.12)}
.camcard img{width:100%;height:100%;display:block}
.word{position:absolute;left:0;right:0;text-align:center;font-family:"Sora Variable",sans-serif;font-weight:700;color:var(--or)}
.url{position:absolute;left:0;right:0;text-align:center;color:var(--ardoise);font-weight:600}
</style>
</head>
<body>
<div id="stage"></div>
<script src="film.js"></script>
</body>
</html>
