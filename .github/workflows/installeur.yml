# Construit les installeurs Windows de Regio à partir du code public, à chaque tag de version (v…) ou à la demande
# (onglet Actions › Installeur Windows › Run workflow).
#  - Installeur COMPLET (moteur vidéo OBS et runtime Visual C++ inclus) : 1re installation, hors ligne.
#  - Installeur LÉGER de mise à jour (sans OBS, déjà installé) + signature + latest.json : mises à jour automatiques.
# Sur un tag, une version BROUILLON est créée sur GitHub avec ces fichiers : on la publie après vérification.
name: Installeur Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Clé de signature des MISES À JOUR (pas la signature Windows) : secrets du dépôt.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances
        run: npm ci

      - name: Composants livrés avec l'installeur (OBS Studio, runtime Visual C++)
        shell: bash
        run: bash scripts/fetch-installer-deps.sh

      - name: Vérifier la signature Microsoft du runtime Visual C++
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature src-tauri/resources/vc_redist.x64.exe
          if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw "Signature du runtime Visual C++ invalide : $($s.Status)" }

      - name: Version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Installeur complet
        shell: bash
        run: |
          npx tauri build --config src-tauri/tauri.installer.conf.json
          mkdir -p out
          mv "src-tauri/target/release/bundle/nsis/Regio_${{ steps.v.outputs.version }}_x64-setup.exe" out/
          (cd out && sha256sum "Regio_${{ steps.v.outputs.version }}_x64-setup.exe" > "Regio_${{ steps.v.outputs.version }}_x64-setup.exe.sha256")

      - name: Mise à jour légère (signée) et latest.json
        shell: bash
        run: |
          npx tauri build --config src-tauri/tauri.update.conf.json
          V="${{ steps.v.outputs.version }}"
          mv "src-tauri/target/release/bundle/nsis/Regio_${V}_x64-setup.exe" "out/Regio_${V}_x64-update.exe"
          mv "src-tauri/target/release/bundle/nsis/Regio_${V}_x64-setup.exe.sig" "out/Regio_${V}_x64-update.exe.sig"
          node scripts/release-files.mjs "$V" "out/Regio_${V}_x64-update.exe.sig" out

      - uses: actions/upload-artifact@v4
        with:
          name: regio-installeur-windows
          path: out/*
          if-no-files-found: error

      - name: Version brouillon sur GitHub (tags seulement)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "${GITHUB_REF_NAME}" --draft --title "Regio ${V}" --notes-file out/notes.md \
            "out/Regio_${V}_x64-setup.exe" "out/Regio_${V}_x64-setup.exe.sha256" \
            "out/Regio_${V}_x64-update.exe" "out/Regio_${V}_x64-update.exe.sig" out/latest.json
