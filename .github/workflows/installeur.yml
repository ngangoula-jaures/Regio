# Construit l'installeur Windows de Regio à partir du code public (exigé par SignPath pour signer).
# Se lance à chaque tag de version (v…) ou à la demande (onglet Actions › Installeur Windows › Run workflow).
name: Installeur Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances
        run: npm ci

      - name: Composants livrés avec l'installeur (OBS Studio, runtime Visual C++)
        shell: bash
        run: bash scripts/fetch-installer-deps.sh

      - name: Vérifier la signature Microsoft du runtime Visual C++
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature src-tauri/resources/vc_redist.x64.exe
          if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw "Signature du runtime Visual C++ invalide : $($s.Status)" }

      - name: Installeur
        run: npx tauri build --config src-tauri/tauri.installer.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: regio-installeur-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
