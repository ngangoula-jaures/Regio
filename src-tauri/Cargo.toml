[package]
name = "regio"
version = "0.1.0"
description = "Régie de culte : projection, diffusion en direct, Bible"
authors = ["Service communication"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "regio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Serveur local (pages pour OBS, page du téléphone en HTTPS, signalisation WebRTC)
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "time", "io-util", "macros", "rt-multi-thread"] }
futures-util = "0.3"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
# TLS avec « ring » : compile sous Windows sans outils supplémentaires (pas d'aws-lc)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
local-ip-address = "0.6"
getrandom = "0.2"
# OBS embarqué : téléchargement (une fois), vérification d'intégrité, extraction
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
